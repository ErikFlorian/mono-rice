# generated by matugen (~/.config/matugen/rice.toml) - edit the template instead
# rice lockscreen: dimmed ASCII wallpaper, thin clock, TUI password field

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    bezier = soft, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 7, out
    animation = fadeOut, 1, 5, soft
    animation = inputFieldDots, 1, 2, out
    animation = inputFieldColors, 1, 4, soft
    animation = inputFieldFade, 1, 5, out
    animation = inputFieldWidth, 1, 4, out
}

background {
    monitor =
    # dimmed copy made by setwall.sh (hyprlock's brightness only works with blur)
    path = ~/.local/state/rice/lock.jpg
    color = rgb({{ colors.background.default.hex_stripped }})
    blur_passes = 0
}


# clock
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb({{ colors.on_surface.default.hex_stripped }})
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraLight
    position = 0, 150
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/quickshell/scripts/czdate.sh
    color = rgb({{ colors.outline.default.hex_stripped }})
    font_size = 14
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 60
    halign = center
    valign = center
}

# user@host above the field
label {
    monitor =
    text = $USER@larptop
    color = rgb({{ colors.outline.default.hex_stripped }})
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -96
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 40
    outline_thickness = 1
    rounding = 0
    inner_color = rgba({{ colors.background.default.hex_stripped }}cc)
    outer_color = rgb({{ colors.outline_variant.default.hex_stripped }})
    check_color = rgb({{ colors.outline.default.hex_stripped }})
    fail_color = rgb({{ colors.error.default.hex_stripped }})
    capslock_color = rgb({{ colors.on_surface.default.hex_stripped }})
    font_color = rgb({{ colors.on_surface.default.hex_stripped }})
    font_family = JetBrainsMono Nerd Font
    dots_size = 0.18
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##{{ colors.outline_variant.default.hex_stripped }}">&gt; password</span>
    fail_text = <span foreground="##{{ colors.error.default.hex_stripped }}">access denied</span>
    check_text = <span foreground="##{{ colors.outline.default.hex_stripped }}">checking…</span>
    position = 0, -140
    halign = center
    valign = center
}

# caption bottom right, like the wallpaper
label {
    monitor =
    text = // locked
    color = rgb({{ colors.outline_variant.default.hex_stripped }})
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -30, 20
    halign = right
    valign = bottom
}
